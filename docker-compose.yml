version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-task-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      # 数据持久化：将本地 data 目录挂载到容器内
      - ./backend/data:/app/data
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: campus-task-ngrok
    command: http backend:3000
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
